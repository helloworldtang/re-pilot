[project]
name = "re-pilot"
version = "0.1.0"
description = "Regex assistant distilled from a local teacher into an on-device small model"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "mlx-lm>=0.20.0",
]

[tool.uv]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
# Mac 原生栈：mlx-lm 通吃 teacher 生成 / LoRA 训练 / 端侧推理

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
